<header id="gh-head" class="gh-head gh-outer">
    <div class="gh-head-inner gh-inner">
        <div class="gh-head-brand">
            <div class="gh-head-brand-wrapper">
                <a class="gh-head-logo" href="{{ "/" | relLangURL }}">{{ .Site.Title }}</a>
            </div>
            <button type="button" class="gh-search gh-icon-btn" data-search-trigger aria-haspopup="dialog" aria-controls="search-modal" aria-label="Search this site">{{ partial "icons/search.html" . }}</button>
            <button class="gh-burger" aria-label="Toggle menu" aria-expanded="false"></button>
        </div>

        <nav class="gh-head-menu" aria-label="Primary">
            {{ partial "menu.html" (dict "context" . "menuID" "main") }}
        </nav>

        <div class="gh-head-actions">
            <button type="button" class="gh-search gh-icon-btn" data-search-trigger aria-haspopup="dialog" aria-controls="search-modal" aria-label="Search this site">{{ partial "icons/search.html" . }}</button>
        </div>
    </div>
</header>
