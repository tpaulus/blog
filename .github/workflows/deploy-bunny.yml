name: Validate and deploy to Bunny

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read Hugo version
        id: hugo-version
        run: echo "version=$(tr -d '\r\n' < .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo-version.outputs.version }}
          extended: true

      - name: Install dependencies
        run: npm ci

      - name: Lint local images
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-site
          path: public
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Bunny
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: bunny-production
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download validated production build
        uses: actions/download-artifact@v4
        with:
          name: production-site
          path: public

      - name: Upload site and purge cache
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_STORAGE_ENDPOINT: ${{ secrets.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_DEPLOY_PREFIX: ${{ secrets.BUNNY_DEPLOY_PREFIX }}
          BUNNY_DEPLOY_CONCURRENCY: ${{ secrets.BUNNY_DEPLOY_CONCURRENCY }}
        run: npm run deploy -- --skip-build --source public
